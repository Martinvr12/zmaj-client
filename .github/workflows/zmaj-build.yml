name: Zmaj Client Build

on:
  workflow_dispatch:
  push:
    branches:
      - polyplus-zmaj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build 1.21.11
        run: ./gradlew :1.21.11-fabric:build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: zmaj-client-1.21.11
          path: versions/1.21.11-fabric/build/libs/*.jar
